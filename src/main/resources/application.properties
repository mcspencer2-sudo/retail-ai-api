spring.application.name=retail-ai-api

server.port=${PORT:8080}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.datasource.url=jdbc:h2:file:./data/universalstylistdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep local H2 data between Spring Boot restarts.
# Do NOT use create-drop unless you intentionally want to wipe users, saved looks, orders, bag items, and inventory.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

retailai.import.row-delay-ms=0
retailai.demo-scan-mode=true

# JWT
# Must stay identical across token creation and token validation.
# After changing this value, clear browser localStorage/sessionStorage and log in again.
retailai.jwt.secret=mcspencer-super-secret-jwt-key-2026-secure-key-12345
retailai.jwt.expiration-ms=86400000
retailai.jwt.debug=true

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.retailai=INFO